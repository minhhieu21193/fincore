version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/minhhieu21193/fincore
