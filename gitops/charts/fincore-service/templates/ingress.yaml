{{- if .Values.ingress.enabled }}
{{- $name := include "svc.name" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                {{- if and .Values.rollout.enabled .Values.rollout.alb.enabled }}
                # Argo Rollouts rewrites the ALB forward action to weight stable vs canary.
                name: {{ $name }}-stable
                port:
                  name: use-annotation
                {{- else }}
                name: {{ $name }}
                port:
                  name: http
                {{- end }}
{{- end }}
