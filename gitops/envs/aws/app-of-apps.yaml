# AWS (EKS). Account-specific facts arrive in .Values.cluster from Terraform
# (terraform/envs/demo/argocd.tf) and are rendered through clusterValues —
# none of them are committed.
env: aws
repoURL: https://github.com/minhhieu21193/fincore.git
targetRevision: main

components:
  karpenter:
    enabled: true
    clusterValues: |
      settings:
        clusterName: {{ .Values.cluster.name }}
        interruptionQueue: {{ .Values.cluster.karpenterInterruptionQueue }}
  karpenter-nodepools:
    enabled: true
    clusterValues: |
      clusterName: {{ .Values.cluster.name }}
      nodeRole: {{ .Values.cluster.karpenterNodeRole }}
      ebsKmsKeyId: {{ .Values.cluster.platformKmsKeyArn }}
      cde:
        ebsKmsKeyId: {{ .Values.cluster.cdeKmsKeyArn }}
  storage:
    enabled: true
    clusterValues: |
      kmsKeyId: {{ .Values.cluster.platformKmsKeyArn }}
  kyverno: { enabled: true }
  policies:
    enabled: true
    clusterValues: |
      images:
        registry: {{ .Values.cluster.ecrRegistry }}
      signature:
        mode: keyless
  vault-base: { enabled: true }
  vault:
    enabled: true
    clusterValues: |
      server:
        extraEnvironmentVars:
          VAULT_CACERT: /vault/userconfig/vault-server-tls/ca.crt
          AWS_REGION: {{ .Values.cluster.region }}
          VAULT_AWSKMS_SEAL_KEY_ID: {{ .Values.cluster.vaultKmsKeyId }}
  vault-config:
    enabled: true
    clusterValues: |
      database:
        host: {{ .Values.cluster.dbHost }}
        sslmode: require
  argo-rollouts: { enabled: true }
  metrics-server: { enabled: true }
  cert-manager: { enabled: true }
  external-secrets: { enabled: true }
  prometheus-operator-crds: { enabled: true }
  kube-prometheus-stack: { enabled: true }
  # Backups go to the backup bucket through Pod Identity (no keys).
  velero:
    enabled: true
    clusterValues: |
      credentials:
        useSecret: false
      configuration:
        backupStorageLocation:
          - name: default
            provider: aws
            bucket: {{ .Values.cluster.backupBucket }}
            prefix: velero
            default: true
            config:
              region: {{ .Values.cluster.region }}
  backups:
    enabled: true
    clusterValues: |
      uploader: aws-cli
      bucket: {{ .Values.cluster.backupBucket }}
      region: {{ .Values.cluster.region }}
  loki: { enabled: true }
  tempo: { enabled: true }
  fluent-bit: { enabled: true }
  dashboards: { enabled: true }
  slo: { enabled: true }
  opencost: { enabled: true }
  aws-load-balancer-controller:
    enabled: true
    clusterValues: |
      clusterName: {{ .Values.cluster.name }}
      region: {{ .Values.cluster.region }}
      vpcId: {{ .Values.cluster.vpcId }}
  external-dns:
    enabled: true
    clusterValues: |
      domainFilters: [{{ .Values.cluster.domain | quote }}]
      txtOwnerId: {{ .Values.cluster.name }}
  secret-stores:
    enabled: true
    clusterValues: |
      provider: aws
      aws:
        region: {{ .Values.cluster.region }}
  cluster-issuers:
    enabled: true
    clusterValues: |
      mode: letsencrypt
      letsencrypt:
        email: {{ .Values.cluster.acmeEmail }}
        region: {{ .Values.cluster.region }}
        hostedZoneID: {{ .Values.cluster.hostedZoneId }}
  fincore-base: { enabled: true }
  cde-base:
    enabled: true
    clusterValues: |
      database:
        host: {{ .Values.cluster.dbHost }}
        sslmode: require
        adminSecretKey: {{ .Values.cluster.dbAdminSecretName }}
      networkPolicies:
        database:
          cidrs: {{ toJson .Values.cluster.databaseSubnetCidrs }}
        queue:
          cidrs: [{{ .Values.cluster.vpcCidr | quote }}]
        ingressCidrs: {{ toJson .Values.cluster.publicSubnetCidrs }}
        awsCredentialsCidrs: ["169.254.170.23/32"]
  ledger:
    enabled: true
    clusterValues: |
      image:
        repository: {{ .Values.cluster.ecrRegistry }}/fincore/ledger
      env:
        DB_HOST: {{ .Values.cluster.dbHost }}
        AWS_REGION: {{ .Values.cluster.region }}
  payments-api:
    enabled: true
    clusterValues: |
      image:
        repository: {{ .Values.cluster.ecrRegistry }}/fincore/payments-api
      env:
        DB_HOST: {{ .Values.cluster.dbHost }}
        SQS_QUEUE_URL: {{ .Values.cluster.paymentEventsQueueUrl }}
        AWS_REGION: {{ .Values.cluster.region }}
      ingress:
        host: api.{{ .Values.cluster.domain }}
        annotations:
          alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.cluster.wafAclArn }}
  notifier:
    enabled: true
    clusterValues: |
      image:
        repository: {{ .Values.cluster.ecrRegistry }}/fincore/notifier
      env:
        SQS_QUEUE_URL: {{ .Values.cluster.paymentEventsQueueUrl }}
        AWS_REGION: {{ .Values.cluster.region }}
  webhook-sink:
    enabled: true
    clusterValues: |
      image:
        repository: {{ .Values.cluster.ecrRegistry }}/fincore/webhook-sink
