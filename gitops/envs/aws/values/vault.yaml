# AWS: auto-unseal with a dedicated KMS key through EKS Pod Identity
# (VAULT_AWSKMS_SEAL_KEY_ID is injected from Terraform as a cluster value).
# Vault runs on the system nodes, whose security group Aurora admits.
injector:
  replicas: 2
server:
  nodeSelector:
    fincore.io/node-role: system
  dataStorage:
    size: 10Gi
    storageClass: gp3-encrypted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: vault
          component: server
