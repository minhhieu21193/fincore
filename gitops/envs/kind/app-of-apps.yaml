# kind: everything runs locally; AWS-only components stay disabled.
env: kind
# In-cluster read-only git server over the bind-mounted local repository
# (installed by scripts/kind-up.sh). targetRevision is set to the current branch.
repoURL: http://gitserver.gitserver.svc.cluster.local/fincore.git
targetRevision: HEAD

components:
  argo-rollouts: { enabled: true }
  metrics-server: { enabled: true }
  cert-manager: { enabled: true }
  external-secrets: { enabled: true }
  prometheus-operator-crds: { enabled: true }
  kube-prometheus-stack: { enabled: true }
  loki: { enabled: true }
  tempo: { enabled: true }
  fluent-bit: { enabled: true }
  dashboards: { enabled: true }
  slo: { enabled: true }
  velero: { enabled: true }
  backups: { enabled: true }
  kyverno: { enabled: true }
  local-kms: { enabled: true }
  policies: { enabled: true }
  vault-base: { enabled: true }
  vault: { enabled: true }
  vault-config: { enabled: true }
  secret-stores: { enabled: true }
  cluster-issuers: { enabled: true }
  local-infra: { enabled: true }
  fincore-base: { enabled: true }
  cde-base: { enabled: true }
  ledger: { enabled: true }
  webhook-sink: { enabled: true }
  payments-api: { enabled: true }
  notifier: { enabled: true }
  traffic-generator: { enabled: true }
