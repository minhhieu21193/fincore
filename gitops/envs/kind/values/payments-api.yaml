# kind: images are built, signed and pushed to the local registry (scripts/build-images.sh).
image:
  repository: fincore-registry:5000/fincore/payments-api
  tag: 0.1.2
  pullPolicy: IfNotPresent
env:
  DB_HOST: postgres.fincore-data.svc.cluster.local
  DB_SSLMODE: disable
  SQS_ENDPOINT: http://elasticmq.fincore-data.svc.cluster.local:9324
  SQS_QUEUE_URL: http://elasticmq.fincore-data.svc.cluster.local:9324/000000000000/fincore-payment-events
  # ElasticMQ ignores credentials; these are placeholders, not secrets.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_REGION: ap-southeast-1
