# kind (laptop VM): no default alerting/recording rules (nothing uses them
# before Phase 3's SLO rules) and a 30s default scrape. FinCore's PodMonitors
# keep their own 15s interval for the canary analysis.
defaultRules:
  create: false
prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
grafana:
  # kind: reached through a port-forward only, so read-only anonymous access
  # is enough for the demo. AWS keeps login-only access.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  # The chart's default Kubernetes dashboards need the default recording
  # rules, which are off on kind; FinCore's own dashboards cover the platform.
  defaultDashboardsEnabled: false
