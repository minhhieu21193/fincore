# kind (a laptop VM, ~20 applications): lighter reconciliation. Release and
# demo scripts annotate the Application to refresh immediately after a commit,
# so a 60s poll does not slow them down.
configs:
  cm:
    timeout.reconciliation: 60s
  params:
    controller.status.processors: 10
    controller.operation.processors: 5
    reposerver.parallelism.limit: 2
controller:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1280Mi }
# The repo server renders large charts (kube-prometheus-stack, Kyverno, Loki)
# on a shared laptop CPU; its full health check took longer than the default
# 1 s and the kubelet killed it mid-render, leaving applications on
# "context deadline exceeded" (seen during DR trials).
repoServer:
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
