# kind (a laptop VM, ~20 applications): lighter reconciliation. Release and
# demo scripts annotate the Application to refresh immediately after a commit,
# so a 60s poll does not slow them down.
configs:
  cm:
    timeout.reconciliation: 60s
  params:
    controller.status.processors: 10
    controller.operation.processors: 5
    reposerver.parallelism.limit: 2
controller:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1280Mi }
