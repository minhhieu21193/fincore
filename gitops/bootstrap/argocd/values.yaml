# Argo CD (chart argo/argo-cd 10.11.1, app v3.5.6). Installed by scripts/kind-up.sh
# on kind and by terraform/envs/demo (helm_release) on EKS.
global:
  domain: argocd.local

configs:
  params:
    server.insecure: true            # TLS terminates at the ingress / port-forward
    controller.diff.server.side: true
  cm:
    timeout.reconciliation: 60s
    # Argo CD does not assess the health of child Applications by default;
    # without this, sync waves in the app-of-apps would not wait for each
    # component to become Healthy before starting the next wave.
    # An Application that has not completed a sync yet has no resources and
    # would look Healthy; it stays Progressing until its sync succeeded (a
    # Phase 3 run started the ledger before Vault existed without this).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "waiting for the first successful sync"
      if obj.status ~= nil and obj.status.sync ~= nil and obj.status.sync.status == "Synced"
         and obj.status.operationState ~= nil and obj.status.operationState.phase == "Succeeded" then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          hs.message = obj.status.health.message or ""
        end
      end
      return hs
  repositories:
    karpenter:
      name: karpenter
      type: helm
      url: public.ecr.aws/karpenter
      enableOCI: "true"
    grafana-community:
      name: grafana-community
      type: helm
      url: ghcr.io/grafana-community/helm-charts
      enableOCI: "true"

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

controller:
  # The controller caches every watched resource type; Kyverno's CRDs (Phase 2)
  # pushed it past 768Mi.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1536Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
