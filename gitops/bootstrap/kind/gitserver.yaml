# kind only: serves the bind-mounted local repository (/fincore-git on every
# node, see scripts/kind-up.sh) read-only to Argo CD. Argo CD tracks HEAD,
# i.e. whatever branch is checked out locally, and sees new commits within
# its reconciliation interval. Uncommitted changes are never deployed.
apiVersion: v1
kind: Namespace
metadata:
  name: gitserver
---
apiVersion: v1
kind: Service
metadata:
  name: gitserver
  namespace: gitserver
spec:
  selector: { app.kubernetes.io/name: gitserver }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitserver
  namespace: gitserver
  labels: { app.kubernetes.io/name: gitserver }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gitserver }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gitserver }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gitserver
          image: fincore/gitserver:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: repo
              mountPath: /repos/fincore.git
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repo
          hostPath:
            path: /fincore-git
            type: Directory
        - name: tmp
          emptyDir: {}
