nameOverride: payments-api
replicas: 3
env:
  LEDGER_URL: http://ledger.fincore-cde.svc.cluster.local:8080
  DB_NAME: payments
  DB_USER: payments
  DB_PORT: "5432"
  # Connection budget: pods x pool. At maxReplicas (12) this service opens at
  # most 60 connections; with the ledger (8 x 5) that is 100 in total, well under
  # the database's limit. A pool of 10 let autoscaling reach 200 backends,
  # and the kind database ran out of memory in the load test (decisions log).
  DB_MAX_CONNS: "5"
  PROCESSOR_LATENCY: 40ms
  PROCESSOR_JITTER: 30ms
  PROCESSOR_DECLINE_RATE: "0.02"
  FEE_BPS: "290"
  IDEMPOTENCY_LOCK_TTL: 30s
secretEnv:
  DB_PASSWORD: { secret: payments-db, key: password }
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 192Mi }
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
rollout:
  enabled: true
# Cardholder-data zone: dedicated, tainted nodes only.
nodeSelector:
  fincore.io/node-role: cde
tolerations:
  - { key: fincore.io/zone, operator: Equal, value: cde, effect: NoSchedule }
