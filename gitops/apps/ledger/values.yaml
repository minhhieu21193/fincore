nameOverride: ledger
replicas: 2
env:
  DB_NAME: ledger
  DB_PORT: "5432"
  # Connection budget: pods x pool. At maxReplicas (8) this service opens at
  # most 40 connections; with the payments-api (12 x 5) that is 100 in total, well under
  # the database's limit. A pool of 10 let autoscaling reach 200 backends,
  # and the kind database ran out of memory in the load test (decisions log).
  DB_MAX_CONNS: "5"
  # Connections are recycled well within the remaining lifetime of the Vault-issued
  # user, so the old user is idle by the time Vault revokes it.
  DB_MAX_CONN_LIFETIME: 10m
# No static password: Vault issues a short-lived PostgreSQL user per pod.
vault:
  enabled: true
  role: ledger
  databaseCredentialsPath: database/creds/ledger
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
rollout:
  enabled: true
# Cardholder-data zone: dedicated, tainted nodes only.
nodeSelector:
  fincore.io/node-role: cde
tolerations:
  - { key: fincore.io/zone, operator: Equal, value: cde, effect: NoSchedule }
