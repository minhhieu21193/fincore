apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator
data:
  traffic.js: |
    {{- .Files.Get "files/traffic.js" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  labels:
    app.kubernetes.io/name: traffic-generator
    app.kubernetes.io/part-of: fincore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-generator
        app.kubernetes.io/part-of: fincore
      annotations:
        checksum/script: {{ .Files.Get "files/traffic.js" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: k6
          image: {{ .Values.image }}
          args: ["run", "--quiet", "--summary-mode=disabled", "/scripts/traffic.js"]
          env:
            - { name: TARGET, value: {{ .Values.target | quote }} }
            - { name: RATE, value: {{ .Values.rate | quote }} }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap: { name: traffic-generator }
        - name: tmp
          emptyDir: {}
