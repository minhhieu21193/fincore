{{- $refresh := .Values.secrets.refreshInterval -}}
{{- $items := list -}}
{{- if .Values.dbInit.enabled -}}
{{- $items = append $items (dict "name" "db-admin" "remote" .Values.database.adminSecretKey "keys" (list "username" "password")) -}}
{{- end -}}
{{- range $name, $s := .Values.secrets.items -}}
{{- /* null removes an item, also one set by an earlier value file */ -}}
{{- if $s }}{{ $items = append $items (dict "name" $name "remote" $s.remote "keys" $s.keys) }}{{ end -}}
{{- end -}}
{{- range $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: fincore-secrets
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- $remote := .remote }}
    {{- range .keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $remote }}
        property: {{ . }}
    {{- end }}
{{- end }}
