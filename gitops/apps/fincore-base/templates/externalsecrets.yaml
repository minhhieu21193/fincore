{{- $refresh := .Values.secrets.refreshInterval -}}
{{- $items := list
  (dict "name" "db-admin" "remote" .Values.database.adminSecretKey "keys" (list "username" "password"))
  (dict "name" "payments-db" "remote" .Values.secrets.paymentsDb "keys" (list "password"))
  (dict "name" "ledger-db" "remote" .Values.secrets.ledgerDb "keys" (list "password"))
  (dict "name" "webhook-signing" "remote" .Values.secrets.webhookSigning "keys" (list "secret"))
-}}
{{- range $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: fincore-secrets
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- $remote := .remote }}
    {{- range .keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $remote }}
        property: {{ . }}
    {{- end }}
{{- end }}
