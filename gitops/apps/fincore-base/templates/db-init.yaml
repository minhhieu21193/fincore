{{- if .Values.dbInit.enabled }}
{{- $db := .Values.database -}}
{{- $vaultServices := list -}}
{{- range $db.services }}{{ if eq .credentials "vault" }}{{ $vaultServices = append $vaultServices .name }}{{ end }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
data:
  init.sh: |
    #!/bin/sh
    # Idempotent: one owner role and one database per service. Works with a real
    # superuser (kind) and with Aurora's rds_superuser.
    #   credentials=static  the role logs in with a password from Secrets Manager
    #                       (re-applied on every sync, so rotations take effect)
    #   credentials=vault   the role is NOLOGIN; Vault creates short-lived login
    #                       roles IN ROLE <service> (see gitops/platform/vault-config)
    set -eu
    until pg_isready -q; do echo "waiting for database"; sleep 2; done
    setup() { # service mode
      svc="$1" mode="$2"
      psql -v ON_ERROR_STOP=1 -v svc="$svc" <<'SQL'
    SELECT format('CREATE ROLE %I NOLOGIN', :'svc')
     WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'svc') \gexec
    -- PG16+: the creating role needs membership to create a database owned by it.
    SELECT format('GRANT %I TO CURRENT_USER', :'svc')
     WHERE NOT pg_has_role(CURRENT_USER, :'svc', 'MEMBER') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'svc', :'svc')
     WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'svc') \gexec
    REVOKE ALL ON DATABASE :"svc" FROM PUBLIC;
    SQL
      if [ "$mode" = static ]; then
        pw_var="$(echo "$svc" | tr '[:lower:]' '[:upper:]')_DB_PASSWORD"
        eval "pw=\${$pw_var}"
        psql -v ON_ERROR_STOP=1 -q -v svc="$svc" -v pw="$pw" <<'SQL'
    ALTER ROLE :"svc" WITH LOGIN PASSWORD :'pw';
    SQL
      else
        # Nobody logs in as the owner role itself.
        psql -v ON_ERROR_STOP=1 -q -v svc="$svc" <<'SQL'
    ALTER ROLE :"svc" WITH NOLOGIN PASSWORD NULL;
    SQL
      fi
      echo "database $svc ready (credentials: $mode)"
    }
    {{- range $db.services }}
    setup {{ .name }} {{ .credentials }}
    {{- end }}
    {{- if $vaultServices }}
    # Vault's database admin: may create roles and grant membership in the
    # Vault-managed owner roles, nothing else. The password is set only when the
    # role is created; Vault rotates it immediately (rotate-root) and from then
    # on only Vault knows it, so it is deliberately never reset here.
    psql -v ON_ERROR_STOP=1 -v admin={{ $db.vaultAdmin.role }} -v pw="$VAULT_ADMIN_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE %I WITH LOGIN CREATEROLE PASSWORD %L', :'admin', :'pw')
     WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'admin') \gexec
    -- Revocation terminates the expired user's remaining sessions.
    GRANT pg_signal_backend TO :"admin";
    SQL
    {{- range $vaultServices }}
    psql -v ON_ERROR_STOP=1 -q -v admin={{ $db.vaultAdmin.role }} -v svc={{ . }} <<'SQL'
    GRANT :"svc" TO :"admin" WITH ADMIN OPTION;
    SQL
    {{- end }}
    echo "vault admin role {{ $db.vaultAdmin.role }} ready"
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    # Re-run on every sync (the script is idempotent) so rotated passwords are applied.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
        app.kubernetes.io/part-of: fincore
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.dbInit.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dbInit.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init
          image: {{ .Values.dbInit.image }}
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - { name: PGHOST, value: {{ $db.host | quote }} }
            - { name: PGPORT, value: {{ $db.port | quote }} }
            - { name: PGDATABASE, value: postgres }
            - { name: PGSSLMODE, value: {{ $db.sslmode | quote }} }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: db-admin, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: db-admin, key: password } }
            {{- range $db.services }}
            {{- if eq .credentials "static" }}
            - name: {{ upper .name }}_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .name }}-db, key: password } }
            {{- end }}
            {{- end }}
            {{- if $vaultServices }}
            - name: VAULT_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: vault-db-admin, key: password } }
            {{- end }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap: { name: db-init }
        - name: tmp
          emptyDir: {}
{{- end }}
