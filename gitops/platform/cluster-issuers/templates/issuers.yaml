# Internal CA (both environments): a self-signed root that issues certificates
# for in-cluster TLS (Vault and its clients). Never exposed outside the cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fincore-selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fincore-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: fincore-internal-ca
  secretName: fincore-internal-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: fincore-selfsigned-root
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fincore-internal
spec:
  ca:
    secretName: fincore-internal-ca
---
{{- if eq .Values.mode "letsencrypt" }}
# Public certificates (the API's ingress): Let's Encrypt with Route 53 DNS-01.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fincore
spec:
  acme:
    server: {{ ternary "https://acme-staging-v02.api.letsencrypt.org/directory" "https://acme-v02.api.letsencrypt.org/directory" .Values.letsencrypt.staging }}
    email: {{ required "letsencrypt.email is required" .Values.letsencrypt.email }}
    privateKeySecretRef:
      name: fincore-acme-account
    solvers:
      - dns01:
          route53:
            region: {{ .Values.letsencrypt.region }}
            hostedZoneID: {{ required "letsencrypt.hostedZoneID is required" .Values.letsencrypt.hostedZoneID }}
{{- else }}
# kind: "public" certificates come from the internal CA as well.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fincore
spec:
  ca:
    secretName: fincore-internal-ca
{{- end }}
