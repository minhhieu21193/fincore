{{- if eq .Values.provider "aws" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fincore-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      # No auth block: the controller's EKS Pod Identity role is used.
{{- else if eq .Values.provider "kubernetes" }}
{{- $ns := .Values.kubernetes.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-secret-reader
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secret-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secret-reader
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secret-reader
subjects:
  - kind: ServiceAccount
    name: eso-secret-reader
    namespace: {{ $ns }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fincore-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $ns }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ $ns }}
      auth:
        serviceAccount:
          name: eso-secret-reader
          namespace: {{ $ns }}
{{- else }}
{{- fail "provider must be aws or kubernetes" }}
{{- end }}
