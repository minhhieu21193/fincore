apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-configurer
automountServiceAccountToken: false
---
# Bootstrap password of Vault's database admin role. Vault rotates it on first
# use (rotate-root), after which this value no longer opens anything.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-db-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fincore-secrets
  target:
    name: vault-db-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.adminSecretRemote }}
        property: password
