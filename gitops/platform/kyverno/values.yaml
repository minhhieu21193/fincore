# Kyverno: admission control for FinCore namespaces (policies/ chart). Only the
# admission controller runs: it verifies image signatures/SBOMs against the
# registry and enforces the ValidatingPolicies at admission time.
#
# Reports are off. Every admission request would otherwise create an
# EphemeralReport object, which on a small cluster costs more API-server memory
# and churn than the whole FinCore application. The evidence of enforcement is
# the admission decision itself (scripts/demo-policies.sh); continuous audit
# scanning is listed as a gap in docs/compliance-mapping.md.
features:
  admissionReports: { enabled: false }
  aggregateReports: { enabled: false }
  policyReports: { enabled: false }
  backgroundScan: { enabled: false }
admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 200m, memory: 128Mi }
      limits: { memory: 384Mi }
# No generate / mutate-existing policies, no reports, no cleanup policies.
backgroundController:
  enabled: false
reportsController:
  enabled: false
cleanupController:
  enabled: false
