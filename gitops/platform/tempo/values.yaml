# Tempo, monolithic. The services export OTLP/HTTP straight to it (no
# collector): one hop less, one pod less per node.
tempo:
  reportingEnabled: false
  retention: 168h
  # Receivers: the chart defaults (OTLP gRPC 4317 and HTTP 4318, plus Jaeger,
  # which the chart templates require). The services use OTLP/HTTP.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }
securityContext:
  fsGroup: 10001
persistence:
  enabled: true
  size: 10Gi
