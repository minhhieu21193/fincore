# OpenCost: cost per namespace, workload and node, from the metrics
# Prometheus already has. AWS: prices from AWS's public price list (the
# default provider). kind: a custom price list (gitops/envs/kind/values/opencost.yaml).
# clusterName is the cluster DNS domain in this chart; the cluster ID is set below.
opencost:
  exporter:
    defaultClusterId: fincore
    resources:
      requests: { cpu: 10m, memory: 96Mi }
      limits: { memory: 384Mi }
  mcp:
    enabled: false
  prometheus:
    internal:
      enabled: true
      serviceName: kube-prometheus-stack-prometheus
      namespaceName: monitoring
      port: 9090
  metrics:
    serviceMonitor:
      enabled: true
  ui:
    enabled: true
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 96Mi }
