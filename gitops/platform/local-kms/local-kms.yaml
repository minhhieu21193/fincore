# kind only: an AWS KMS API emulator so Vault's "awskms" auto-unseal runs locally
# with the same configuration as on AWS. The seed (key id + random key material)
# is generated by scripts/kind-up.sh into the Secret local-kms-seed; nothing
# here is a real key and the emulator is reachable only from Vault.
apiVersion: v1
kind: Service
metadata:
  name: local-kms
  namespace: vault
  labels: { app.kubernetes.io/name: local-kms }
spec:
  selector: { app.kubernetes.io/name: local-kms }
  ports:
    - { name: kms, port: 8080, targetPort: kms }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-kms
  namespace: vault
  labels: { app.kubernetes.io/name: local-kms }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: local-kms }
  template:
    metadata:
      labels: { app.kubernetes.io/name: local-kms }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: local-kms
          image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
          env:
            - { name: KMS_REGION, value: ap-southeast-1 }
            - { name: KMS_ACCOUNT_ID, value: "000000000000" }
            - { name: KMS_SEED_PATH, value: /seed/seed.yaml }
            - { name: KMS_DATA_PATH, value: /data }
            - { name: PORT, value: "8080" }
          ports:
            - { name: kms, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: kms }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: seed
          secret: { secretName: local-kms-seed }
        - name: data
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-kms-ingress
  namespace: vault
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: local-kms }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: vault }
      ports:
        - { protocol: TCP, port: 8080 }
