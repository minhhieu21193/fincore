# Velero: cluster state that git does not hold, to the backup bucket.
# Application data has its own consistent backups (Vault Raft snapshots and
# database backups, gitops/platform/backups), so no volume snapshots and no
# node agent.
image:
  repository: docker.io/velero/velero
  tag: v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
    volumeMounts:
      - { mountPath: /target, name: plugins }
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
# Argo CD applies the chart's CRDs; no upgrade Job.
upgradeCRDs: false
snapshotsEnabled: false
deployNodeAgent: false
resources:
  requests: { cpu: 20m, memory: 96Mi }
  limits: { memory: 256Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
# Velero is the first sync wave, before the Prometheus Operator CRDs: scraped
# through its pod annotations, no ServiceMonitor.
metrics:
  enabled: true
  serviceMonitor: { enabled: false }
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: fincore-backups
      prefix: velero
      default: true
      config:
        region: ap-southeast-1
  volumeSnapshotLocation: []
  # A new cluster sees the backups already in the bucket within this period.
  backupSyncPeriod: 30s
schedules:
  # Secrets in the namespaces whose state is not in git (on kind: the emulated
  # Secrets Manager and the KMS seed), every 15 minutes, kept 3 days.
  cluster-state:
    disabled: false
    schedule: "*/15 * * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 72h
      storageLocation: default
      includedNamespaces: [secrets-emulator, vault]
      includedResources: [secrets]
      snapshotVolumes: false
