# clusterName and nodeRole are injected at bootstrap from Terraform outputs.
clusterName: ""
nodeRole: ""
# -- KMS key for the root volumes of general nodes (AWS: the platform key);
# empty uses the account's default EBS key.
ebsKmsKeyId: ""
# -- Pinned EKS-optimised AL2023 AMI release (github.com/awslabs/amazon-eks-ami/releases).
amiAlias: al2023@v20261019
spot:
  weight: 100
  cpuLimit: "64"
onDemand:
  weight: 10
  cpuLimit: "32"
disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 1m
  expireAfter: 720h
  # -- Never disrupt more than 10% of nodes at once.
  budget: "10%"
# Cardholder-data zone NodePool (on-demand, tainted fincore.io/zone=cde).
cde:
  enabled: true
  cpuLimit: "16"
  # -- Tags of the CDE node security group created by Terraform (modules/eks).
  securityGroupTags:
    fincore.io/security-group: cde
  # -- KMS key for the CDE nodes' root volumes (AWS: the CDE key): their disks
  # hold the zone's container logs and emptyDir data.
  ebsKmsKeyId: ""
