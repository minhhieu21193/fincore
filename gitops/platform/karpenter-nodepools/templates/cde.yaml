{{- if .Values.cde.enabled }}
# Cardholder-data zone: dedicated on-demand nodes, tainted so only zone
# workloads land here, with an extra security group (created by Terraform)
# that Aurora admits; ordinary workload nodes do not carry it.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: cde
spec:
  role: {{ required "nodeRole is required" .Values.nodeRole }}
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName }}
  # Terms are ORed: the shared node security group plus the CDE one.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
    - tags:
        {{- toYaml .Values.cde.securityGroupTags | nindent 8 }}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        encrypted: true
        {{- with .Values.cde.ebsKmsKeyId }}
        kmsKeyID: {{ . }}
        {{- end }}
        deleteOnTermination: true
  tags:
    Project: fincore
    ManagedBy: karpenter
    fincore.io/zone: cde
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cde
spec:
  limits:
    cpu: {{ .Values.cde.cpuLimit | quote }}
  disruption:
    # Conservative: only empty nodes are removed, at most one at a time.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
  template:
    metadata:
      labels:
        fincore.io/node-role: cde
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: cde
      taints:
        - key: fincore.io/zone
          value: cde
          effect: NoSchedule
      expireAfter: {{ .Values.disruption.expireAfter }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
{{- end }}
