# Loki, single binary (monolithic). Log volume here is small; the scalable
# modes need object storage and several more pods for no gain at this size.
# Tenancy is off: one platform, one tenant, access controlled by Grafana.
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # No anonymous usage reports.
  analytics:
    reporting_enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
# Caches, gateway, canary and the helm test are sized for production clusters.
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
# Loki ships its own ServiceMonitors and dashboards; Prometheus only scrapes
# what the SLO and platform dashboards use.
monitoring:
  selfMonitoring: { enabled: false }
  serviceMonitor: { enabled: false }
  dashboards: { enabled: false }
  rules: { enabled: false }
sidecar:
  rules: { enabled: false }
# Scalable targets stay at zero in monolithic mode.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
