# Local stand-in for Amazon SQS (kind only). Same queue names and redrive
# policy as terraform/modules/queues: 5 receives, then the DLQ.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticmq
  namespace: fincore-data
data:
  elasticmq.conf: |
    include classpath("application.conf")
    node-address {
      protocol = http
      host = elasticmq.fincore-data.svc.cluster.local
      port = 9324
      context-path = ""
    }
    rest-sqs {
      enabled = true
      bind-port = 9324
      bind-hostname = "0.0.0.0"
      sqs-limits = strict
    }
    rest-stats.enabled = false
    queues {
      fincore-payment-events-dlq {
        messageRetentionPeriod = 14 days
      }
      fincore-payment-events {
        defaultVisibilityTimeout = 30 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
          name = "fincore-payment-events-dlq"
          maxReceiveCount = 5
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: fincore-data
  labels: { app.kubernetes.io/name: elasticmq }
spec:
  selector: { app.kubernetes.io/name: elasticmq }
  ports:
    - name: sqs
      port: 9324
      targetPort: sqs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: fincore-data
  labels: { app.kubernetes.io/name: elasticmq }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: elasticmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: elasticmq }
      annotations:
        # Bump to roll the pod when the queue config changes.
        fincore.io/config-rev: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
          ports:
            - name: sqs
              containerPort: 9324
          readinessProbe:
            tcpSocket: { port: sqs }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap: { name: elasticmq }
        - name: tmp
          emptyDir: {}
