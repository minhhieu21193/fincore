# One compliant workload per zone and one per violation (see kyverno-test.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: compliant-cde-pod
  namespace: fincore-cde
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: fincore-registry:5000/fincore/ledger:0.1.0
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  nodeSelector:
    fincore.io/node-role: cde
  tolerations:
  - key: fincore.io/zone
    operator: Equal
    value: cde
    effect: NoSchedule
---
